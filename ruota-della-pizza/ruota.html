<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17152b" />
    <title>Ruota della pizza</title>

    <style>
      * {
        box-sizing: border-box;
      }

      @font-face {
        font-family: "Intro Rust";
        src: url("assets/fonts/IntroRustG-Base2Line.otf") format("opentype");
        font-weight: normal;
        font-style: normal;
      }

      @font-face {
        font-family: "Rust Paragraph";
        src: url("assets/fonts/IntroHeadR-Base.otf") format("opentype");
        font-weight: bold;
        font-style: normal;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: black;
      }

      #logo {
        margin: 0;
        height: 100px;
      }

      button {
        font-family: "Intro Rust", sans-serif;
      }

      .game {
        width: min(100%, 490px);
        padding: clamp(20px, 5vw, 36px);
        text-align: center;
        border: 1px solid #ffffff18;
        background: #ffffff06;
        box-shadow: 0 24px 70px #00000030;
      }

      .intro {
        margin: 14px auto 0;
        max-width: 32ch;
        color: #c4bfd8;
        font-size: larger;
        font-family: 'Rust Paragraph', sans-serif;
        line-height: 1.6;
      }

      .wheel-area {
        position: relative;
        width: min(100%, 350px);
        margin: 34px auto 28px;
        aspect-ratio: 1;
      }

      .pointer {
        position: absolute;
        z-index: 3;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 30px;
        height: 38px;
        background: #108337;
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        filter: drop-shadow(0 3px 3px #00000040);
      }

      .wheel {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border: 2px solid gray;
        border-radius: 50%;
      }

      .wheel.is-spinning {
        transition: transform 3.6s cubic-bezier(0.12, 0.75, 0.12, 1);
      }

      .sector-label {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 28%;
        color: white;
        font-family: 'Intro Rust', sans-serif;
        font-size: clamp(0.7rem, 3vw, 0.95rem);
        font-weight: 800;
        line-height: 1.15;
        text-align: center;
        pointer-events: none;
      }

      .hub {
        position: absolute;
        z-index: 2;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border: 3px solid #108337;
        border-radius: 50%;
        background: black;
        font-size: 1.5rem;
      }

      .spin-button {
        width: 50%;
        min-height: 54px;
        padding: 14px 20px;
        border: 0;
        background: #175640;
        color: white;
        font-weight: 800;
        cursor: pointer;
        transition: background 160ms ease;
      }

      .spin-button:hover:not(:disabled) {
        background: #ddd6fe;
      }

      .spin-button:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      button:focus-visible {
        outline: 3px solid #fcd34d;
        outline-offset: 5px;
      }

      #start-modal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.42);
        z-index: 100;
      }

      #start-modal.hidden {
        display: none;
      }

      #end-modal {
        position: fixed;
        
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.42);
        z-index: 100;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }

      #end-modal.visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .start-card {
        position: relative;
        width: min(92vw, 560px);
        background: #000000;
        border: 4px solid #175640;
        padding: 130px 30px 28px;
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.5);
        transform: translateY(16px) scale(0.96);
        transition: transform 0.35s ease;
      }

      #end-modal.visible .start-card {
        transform: translateY(0) scale(1);
      }

      .start-card img {
        position: absolute;
        top: -78px;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 100%;
        border: solid 3px #b81c12;
        width: 180px;
        height: 180px;
        object-fit: cover;
        filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.45));
        z-index: 2;
      }

      .start-card p {
        margin: 0;
        color: #ffffff;
        font-size: clamp(1.5rem, 3vw, 2.7rem);
        line-height: 1.2;
        text-align: center;
        font-family: "Rust Paragraph", sans-serif;
      }

      .result-label {
        display: block;
        margin-bottom: 12px;
        color: #f3d57d;
        font-size: clamp(1.1rem, 2vw, 1.5rem);
        font-family: "Rust Paragraph", sans-serif;
      }

      .result-description {
        margin: 12px 0 0;
        color: #eae3d2;
        font-size: clamp(1rem, 2vw, 1.3rem);
        line-height: 1.5;
        font-family: "Rust Paragraph", sans-serif;
      }

      .start-button,
      .back-button {
        display: block;
        margin: 24px auto 0;
        background: #124b3c;
        color: #ffffff;
        border: 2px solid #1f7e68;
        width: 100%;
        padding: 14px 28px;
        font-size: 1.5rem;
        font-family: "Intro Rust", sans-serif;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      .start-button:hover,
      .back-button:hover {
        transform: translateY(-1px);
        filter: brightness(1.08);
      }

      .end-actions {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: 26px;
      }

      .back-button {
        background: #3a1d12;
        border-color: #a85b34;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .wheel.is-spinning,
        .spin-button,
        .start-card {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="game">
      <img src="assets/img/logo-coce-completo.svg" alt="logo-coce" id="logo" />

      <p class="intro">
        Gira la ruota e scopri che pizza ordinare.
        Se non sei convinto, forse hai già scelto.
      </p>

      <div class="wheel-area" aria-hidden="true">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
        <div class="hub"></div>
      </div>

      <p class="sr-only" id="prize-list"></p>

      <button
        class="spin-button"
        id="spin-button"
        type="button"
        aria-describedby="prize-list"
        disabled
      >
        Gira la ruota
      </button>

      <p
        class="sr-only"
        id="announcement"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></p>
    </main>

    <div id="start-modal" aria-live="polite">
      <div class="start-card">
        <img src="assets/img/bogdan-contrariato.png" alt="Bogdan contrariato" />
        <p>Hey, ancora niente? Senti non ho tutta la sera... gira la ruota e scegli una pizza a caso no? </p>
        <button id="start-button" class="start-button" type="button">Gioca</button>
      </div>
    </div>

    <div id="end-modal" aria-live="polite" aria-modal="true" role="dialog">
      <div class="start-card">
        <img id="end-image" src="../../coce/img/margherita.jpeg" alt="Pizza scelta" />
        <p class="result-label" id="end-label">Pizza scelta</p>
        <p id="end-description" class="result-description">Descrizione pizza</p>
        <div class="end-actions">
          <button id="restart-button" class="start-button" type="button">Gira di nuovo</button>
          <a class="back-button" href="../index.html" aria-label="Torna indietro">Torna indietro</a>
        </div>
      </div>
    </div>

    <script>
      const pizze = [
        {
          label: "Coce Veg",
          description: "Crema di zucca arrosto, porcini spadellati, gel di mirtillo...una pizza veg ricca, morbida e dal gusto autunnale. Versione vegana disponibile senza fior di latte.",
          image: "assets/img/pizze/coce-veg.jpg",
          color: "#bf8c4e",
        },
        {
          label: "Carabinera",
          description: "La classica pizza casertana tra le sfumature del nero: pomodoro pelato, salsiccia stagionata di maiale locale Az Perol Carni, mousse di aglio nero, olio Còce, polvere di olive nere e basilico.",
          image: "assets/img/pizze/carabinera.jpg",
          color: "#175640",
        },
        {
          label: "Quattro Formaggi",
          description: "Un mix di formaggi stagionati, morbido e intenso, con una texture vellutata e un gusto pieno e avvolgente.",
          image: "assets/img/pizze/quattro-formaggi.jpeg",
          color: "#b81c12",
        },
        {
          label: "Diavola Già Giù",
          description: "Piccante, decisa e irresistibile: una pizza che mette subito in primo piano il gusto intenso e rustico della diavola.",
          image: "assets/img/pizze/diavola-gia-giu.jpg",
          color: "#bf8c4e",
        },
        {
          label: "Curnut e Mazziat",
          description: "Una pizza ricca e piena di carattere, con ingredienti saporiti e un equilibrio perfetto tra gusto e tradizione.",
          image: "assets/img/pizze/curnut-e-mazziat.jpeg",
          color: "#175640",
        },
        {
          label: "Scarola Mbuttunat",
          description: "Una pizza elegante e saporita, con scarola, formaggi e aromi intensi che regalano un gusto decisamente casereccio.",
          image: "assets/img/pizze/scarola-mbuttunat.jpg",
          color: "#b81c12",
        },
        {
          label: "Ricciarè",
          description: "Una margherita rivisitata: pizza classica, fresca e moderna, con il gusto pulito del pomodoro e della mozzarella reso ancora più intenso e personale.",
          image: "assets/img/pizze/ricciare.jpeg",
          color: "#bf8c4e",
        },
        {
          label: "Zì Nicola",
          description: "Fior di latte Az Casolare, scamorza affumicata, lardo di maiale locale Az Perol Carni, gel al limone nero, basilico, mix di formaggi stagionati, pepe, pane croccante e olio EVO: una pizza ricca, intensa e piena di contrasti.",
          image: "assets/img/pizze/zi-nicola.jpeg",
          color: "#175640",
        },
      ];

      const wheel = document.getElementById("wheel");
      const spinButton = document.getElementById("spin-button");
      const startButton = document.getElementById("start-button");
      const startModal = document.getElementById("start-modal");
      const endModal = document.getElementById("end-modal");
      const endImage = document.getElementById("end-image");
      const endLabel = document.getElementById("end-label");
      const endDescription = document.getElementById("end-description");
      const restartButton = document.getElementById("restart-button");
      const announcement = document.getElementById("announcement");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      const sectorAngle = 360 / pizze.length;
      let rotation = 0;
      let spinning = false;

      wheel.style.background = `conic-gradient(
        ${pizze
          .map((prize, index) => {
            const start = index * sectorAngle;
            const end = (index + 1) * sectorAngle;
            return `${prize.color} ${start}deg ${end}deg`;
          })
          .join(",")}
      )`;

      pizze.forEach((prize, index) => {
        const label = document.createElement("span");
        label.className = "sector-label";
        label.textContent = prize.label;

        const angle = index * sectorAngle + sectorAngle / 2;
        const radians = (angle * Math.PI) / 180;

        label.style.left = `${50 + Math.sin(radians) * 32}%`;
        label.style.top = `${50 - Math.cos(radians) * 32}%`;
        label.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;

        wheel.appendChild(label);
      });

      document.getElementById("prize-list").textContent =
        "Premi disponibili: " + pizze.map((prize) => prize.label).join(", ") + ".";

      function hideEndModal() {
        endModal.classList.remove("visible");
      }

      function resetWheel() {
        spinning = false;
        spinButton.disabled = false;
        spinButton.textContent = "Gira la ruota";
        wheel.classList.remove("is-spinning");
        wheel.style.transform = "rotate(0deg)";
        rotation = 0;
      }

      startButton.addEventListener("click", () => {
        startModal.classList.add("hidden");
        spinButton.disabled = false;
      });

      restartButton.addEventListener("click", () => {
        hideEndModal();
        resetWheel();
      });

      spinButton.addEventListener("click", () => {
        if (spinning || spinButton.disabled) return;

        spinning = true;
        spinButton.disabled = true;
        spinButton.textContent = "La ruota sta girando…";
        announcement.textContent = "Estrazione in corso.";

        const selectedIndex = Math.floor(Math.random() * pizze.length);
        const selectedPrize = pizze[selectedIndex];
        const sectorCenter = selectedIndex * sectorAngle + sectorAngle / 2;

        const targetAngle = (360 - sectorCenter) % 360;
        const currentAngle = ((rotation % 360) + 360) % 360;
        const alignment = (targetAngle - currentAngle + 360) % 360;

        rotation += 360 * 5 + alignment;

        let completed = false;
        let fallbackTimer;

        function finish() {
          if (completed) return;
          completed = true;

          clearTimeout(fallbackTimer);
          wheel.removeEventListener("transitionend", onTransitionEnd);
          wheel.classList.remove("is-spinning");

          endImage.src = selectedPrize.image;
          endImage.alt = selectedPrize.label;
          endLabel.textContent = selectedPrize.label;
          endDescription.textContent = selectedPrize.description;
          endModal.classList.add("visible");

          announcement.textContent = `Risultato: ${selectedPrize.label}.`;

          spinning = false;
          spinButton.disabled = false;
          spinButton.textContent = "Gira di nuovo";
        }

        function onTransitionEnd(event) {
          if (event.target === wheel && event.propertyName === "transform") {
            finish();
          }
        }

        if (reducedMotion.matches) {
          wheel.style.transform = `rotate(${rotation}deg)`;
          finish();
          return;
        }

        wheel.addEventListener("transitionend", onTransitionEnd);
        wheel.classList.add("is-spinning");

        void wheel.offsetWidth;
        wheel.style.transform = `rotate(${rotation}deg)`;

        fallbackTimer = setTimeout(finish, 4100);
      });
    </script>
  </body>
</html>
