<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17152b">
  <title>Gira e scopri — Ruota della fortuna</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: #f8fafc;
      background: #17152b;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(circle at 15% 15%, #7145a533, transparent 40%),
        radial-gradient(circle at 90% 85%, #16b8a622, transparent 40%),
        #17152b;
    }

    button {
      font: inherit;
    }

    .game {
      width: min(100%, 490px);
      padding: clamp(20px, 5vw, 36px);
      text-align: center;
      border: 1px solid #ffffff18;
      border-radius: 28px;
      background: #ffffff06;
      box-shadow: 0 24px 70px #00000030;
    }

    .badge {
      display: inline-block;
      margin: 0 0 12px;
      padding: 7px 12px;
      border: 1px solid #ffffff20;
      border-radius: 999px;
      color: #d8b4fe;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.9rem, 7vw, 2.65rem);
      letter-spacing: -0.05em;
      line-height: 1.1;
    }

    .intro {
      margin: 14px auto 0;
      max-width: 32ch;
      color: #c4bfd8;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .wheel-area {
      position: relative;
      width: min(100%, 350px);
      margin: 34px auto 28px;
      aspect-ratio: 1;
    }

    .pointer {
      position: absolute;
      z-index: 3;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 38px;
      background: #fff;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      filter: drop-shadow(0 3px 3px #00000040);
    }

    .wheel {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border: 8px solid #fff;
      border-radius: 50%;
      box-shadow: 0 12px 35px #00000040;
      transform: rotate(0deg);
    }

    .wheel.is-spinning {
      transition: transform 3.6s cubic-bezier(0.12, 0.75, 0.12, 1);
    }

    .sector-label {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 28%;
      color: #201b32;
      font-size: clamp(0.7rem, 3vw, 0.95rem);
      font-weight: 800;
      line-height: 1.15;
      text-align: center;
      pointer-events: none;
    }

    .hub {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      border: 5px solid #fff;
      border-radius: 50%;
      background: #201b32;
      box-shadow: 0 3px 12px #00000030;
      font-size: 1.5rem;
    }

    .spin-button {
      width: 100%;
      min-height: 54px;
      padding: 14px 20px;
      border: 0;
      border-radius: 16px;
      background: #c4b5fd;
      color: #201b32;
      font-weight: 800;
      cursor: pointer;
      transition: background 160ms ease;
    }

    .spin-button:hover:not(:disabled) {
      background: #ddd6fe;
    }

    .spin-button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    button:focus-visible {
      outline: 3px solid #fcd34d;
      outline-offset: 5px;
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      border: 1px solid #ffffff18;
      border-radius: 18px;
      background: #ffffff07;
    }

    .result[hidden] {
      display: none;
    }

    .result-kicker {
      margin: 0 0 8px;
      color: #c4bfd8;
      font-size: 0.85rem;
    }

    .result-title {
      margin: 0;
      font-size: 1.45rem;
    }

    .result-description {
      margin: 10px 0 16px;
      color: #c4bfd8;
      line-height: 1.5;
      font-size: 0.9rem;
    }

    .coupon {
      display: block;
      padding: 12px;
      border: 1px dashed #c4b5fd;
      border-radius: 10px;
      background: #17152b;
      color: #e9d5ff;
      font-family: ui-monospace, monospace;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      user-select: all;
      overflow-wrap: anywhere;
    }

    .note {
      margin: 18px 0 0;
      color: #a7a0bf;
      font-size: 0.75rem;
      line-height: 1.6;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .wheel.is-spinning,
      .spin-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <p class="badge">Un giro, una sorpresa</p>

    <h1>Gira e scopri!</h1>

    <p class="intro">
      Metti alla prova la tua fortuna:
      un piccolo premio ti aspetta.
    </p>

    <div class="wheel-area" aria-hidden="true">
      <div class="pointer"></div>
      <div class="wheel" id="wheel"></div>
      <div class="hub">✦</div>
    </div>

    <p class="sr-only" id="prize-list"></p>

    <button
      class="spin-button"
      id="spin-button"
      type="button"
      aria-describedby="prize-list demo-note"
    >
      Gira la ruota
    </button>

    <section class="result" id="result" hidden aria-labelledby="result-title">
      <p class="result-kicker">La ruota ha scelto…</p>
      <h2 class="result-title" id="result-title"></h2>
      <p class="result-description" id="result-description"></p>
      <span class="sr-only">Codice dimostrativo:</span>
      <code class="coupon" id="coupon"></code>
    </section>

    <p
      class="sr-only"
      id="announcement"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></p>

    <p class="note" id="demo-note">
      Versione dimostrativa: i codici non sono attivi.
      Puoi girare nuovamente per provare il gioco.
    </p>
  </main>

  <script>
    const prizes = [
      {
        label: "−5%",
        title: "Sconto del 5%",
        description: "Un piccolo risparmio sul tuo prossimo acquisto.",
        code: "DEMO5",
        color: "#fbbf24"
      },
      {
        label: "Omaggio",
        title: "Un piccolo omaggio",
        description: "Una sorpresa da aggiungere al tuo prossimo ordine.",
        code: "DEMOGIFT",
        color: "#fb923c"
      },
      {
        label: "−10%",
        title: "Sconto del 10%",
        description: "Il tuo prossimo acquisto diventa più conveniente.",
        code: "DEMO10",
        color: "#f9a8d4"
      },
      {
        label: "Spedizione",
        title: "Spedizione gratuita",
        description: "Un pensiero in meno per il tuo prossimo ordine.",
        code: "DEMOSHIP",
        color: "#c4b5fd"
      },
      {
        label: "−3 €",
        title: "Sconto di 3 €",
        description: "Un piccolo bonus sul tuo prossimo acquisto.",
        code: "DEMO3EURO",
        color: "#7dd3fc"
      },
      {
        label: "−15%",
        title: "Sconto del 15%",
        description: "Hai trovato lo sconto più alto della ruota!",
        code: "DEMO15",
        color: "#6ee7b7"
      }
    ];

    const wheel = document.getElementById("wheel");
    const spinButton = document.getElementById("spin-button");
    const result = document.getElementById("result");
    const resultTitle = document.getElementById("result-title");
    const resultDescription = document.getElementById("result-description");
    const coupon = document.getElementById("coupon");
    const announcement = document.getElementById("announcement");
    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const sectorAngle = 360 / prizes.length;
    let rotation = 0;
    let spinning = false;

    wheel.style.background = `conic-gradient(
      ${prizes.map((prize, index) => {
        const start = index * sectorAngle;
        const end = (index + 1) * sectorAngle;
        return `${prize.color} ${start}deg ${end}deg`;
      }).join(",")}
    )`;

    prizes.forEach((prize, index) => {
      const label = document.createElement("span");
      label.className = "sector-label";
      label.textContent = prize.label;

      const angle = index * sectorAngle + sectorAngle / 2;
      const radians = angle * Math.PI / 180;

      label.style.left = `${50 + Math.sin(radians) * 32}%`;
      label.style.top = `${50 - Math.cos(radians) * 32}%`;
      label.style.transform =
        `translate(-50%, -50%) rotate(${angle}deg)`;

      wheel.appendChild(label);
    });

    document.getElementById("prize-list").textContent =
      "Premi dimostrativi disponibili: " +
      prizes.map(prize => prize.title).join(", ") + ".";

    spinButton.addEventListener("click", () => {
      if (spinning) return;

      spinning = true;
      spinButton.disabled = true;
      spinButton.textContent = "La ruota sta girando…";
      result.hidden = true;
      announcement.textContent = "Estrazione in corso.";

      const selectedIndex = Math.floor(Math.random() * prizes.length);
      const selectedPrize = prizes[selectedIndex];

      const sectorCenter =
        selectedIndex * sectorAngle + sectorAngle / 2;

      // L'indicatore è a 0°: il centro scelto deve arrivare in alto.
      const targetAngle = (360 - sectorCenter) % 360;
      const currentAngle = ((rotation % 360) + 360) % 360;
      const alignment = (targetAngle - currentAngle + 360) % 360;

      rotation += 360 * 5 + alignment;

      let completed = false;
      let fallbackTimer;

      function finish() {
        if (completed) return;
        completed = true;

        clearTimeout(fallbackTimer);
        wheel.removeEventListener("transitionend", onTransitionEnd);
        wheel.classList.remove("is-spinning");

        resultTitle.textContent = selectedPrize.title;
        resultDescription.textContent =
          selectedPrize.description + " Codice dimostrativo non attivo.";
        coupon.textContent = selectedPrize.code;
        result.hidden = false;

        announcement.textContent =
          `Risultato: ${selectedPrize.title}. ` +
          `Codice dimostrativo: ${selectedPrize.code}. Non attivo.`;

        spinning = false;
        spinButton.disabled = false;
        spinButton.textContent = "Gira di nuovo";
      }

      function onTransitionEnd(event) {
        if (event.target === wheel && event.propertyName === "transform") {
          finish();
        }
      }

      if (reducedMotion.matches) {
        wheel.style.transform = `rotate(${rotation}deg)`;
        finish();
        return;
      }

      wheel.addEventListener("transitionend", onTransitionEnd);
      wheel.classList.add("is-spinning");

      // Conferma lo stato iniziale prima della nuova rotazione.
      void wheel.offsetWidth;
      wheel.style.transform = `rotate(${rotation}deg)`;

      // Evita di lasciare il pulsante bloccato se l'evento non arriva.
      fallbackTimer = setTimeout(finish, 4100);
    });
  </script>
</body>
</html>
