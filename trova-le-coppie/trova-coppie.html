<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trova le Coppie</title>
    <style>
      @font-face {
        font-family: "Intro Rust";
        src: url("assets/fonts/IntroRustG-Base2Line.otf") format("opentype");
        font-weight: normal;
        font-style: normal;
      }

      @font-face {
        font-family: "Rust Paragraph";
        src: url("assets/fonts/IntroHeadR-Base.otf") format("opentype");
        font-weight: bold;
        font-style: normal;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: black;
        font-family: "Intro Rust";
        color: white;
        min-height: 100vh;
        margin: 0;
        padding: 20px 0;
      }

      #logo-coce {
        width: 250px;
      }

      #top-bar {
        display: flex;
        gap: 50px;
        font-size: x-small;
      }

      #campo {
        display: grid;
        align-items: center;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(5, 1fr);
        column-gap: 3px;
        row-gap: 5px;
        margin-bottom: 50px;
      }

      #tasti {
        display: flex;
        gap: 20px;
      }

      #back {
        padding: 10px;
        background-color: #175640;
        color: white;
        text-decoration: none;
      }

      #restart {
        padding: 10px;
        color: white;
        font-family: "Intro Rust";
        background-color: #b81c12;
        border-radius: 0;
        font-size: large;
        border: none;
        cursor: pointer;
      }
      #restart:hover {
        background-color: #d32f22;
      }

      /* ---------- Card con flip 3D ---------- */
      .card {
        width: 80px;
        height: 100px;
        perspective: 600px;
        cursor: pointer;
        user-select: none;
      }

      .card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.4s;
        transform-style: preserve-3d;
      }

      .card.girata .card-inner,
      .card.abbinata .card-inner {
        transform: rotateY(180deg);
      }

      .card-front,
      .card-back {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        background-color: #175640;
        border: solid 2px #bf8c4e;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-sizing: border-box;
      }

      /* Faccia coperta: logo tondo */
      .card-back img {
        width: 40px;
        height: 40px;
        border-radius: 50%;
      }

      /* Faccia scoperta: pizza o nome */
      .card-front {
        transform: rotateY(180deg);
        padding: 2px;
        text-align: center;
        font-family: "Rust Paragraph", sans-serif;
        font-weight: bold;
        font-size: 11px;
        line-height: 1.15;
        color: white;
        word-break: break-word;
        hyphens: auto;
      }

      .card-front img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 0;
      }

      /* Coppia abbinata */
      .card.abbinata {
        pointer-events: none;
      }
      .card.abbinata .card-front {
        border-color: #27ae60;
        box-shadow: 0 0 8px #27ae60;
      }

      /* Feedback errore */
      .card.errore {
        animation: shake 0.35s ease;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-4px);
        }
        75% {
          transform: translateX(4px);
        }
      }

      #start-modal,
      #end-modal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.42);
        z-index: 100;
      }

      #start-modal.hidden,
      #end-modal.hidden {
        display: none;
      }

      .start-card {
        position: relative;
        width: min(92vw, 560px);
        background: #000000;
        border: 4px solid #175640;
        padding: 130px 30px 28px;
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.5);
        transform: translateY(16px) scale(0.96);
        transition: transform 0.35s ease;
      }

      .start-card img {
        position: absolute;
        top: -78px;
        left: 50%;
        background-color: rgba(0, 0, 0, 0.5);
        transform: translateX(-50%);
        border-radius: 100%;
        border: solid 3px #b81c12;
        width: 180px;
        height: 180px;
        object-fit: cover;
        filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.45));
        z-index: 2;
      }

      .start-card p {
        margin: 0;
        color: #ffffff;
        font-size: clamp(1.5rem, 3vw, 2.7rem);
        line-height: 1.2;
        text-align: center;
        font-family: "Rust Paragraph", sans-serif;
      }

      .start-button,
      .back-button {
        display: block;
        margin: 24px auto 0;
        background: #124b3c;
        color: #ffffff;
        border: 2px solid #1f7e68;
        width: 100%;
        padding: 14px 28px;
        font-size: 1.5rem;
        font-family: "Intro Rust", sans-serif;
        cursor: pointer;
        text-decoration: none;
        transition:
          transform 0.15s ease,
          filter 0.15s ease;
      }

      .start-card .end-stats {
        margin-top: 18px;
        font-family: "Intro Rust", sans-serif;
        font-size: 1.1rem;
        color: #bf8c4e;
      }

      .end-buttons {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }

      .end-buttons .start-button,
      .end-buttons .back-button {
        margin: 0;
        padding: 14px 10px;
        font-size: 1.2rem;
        text-align: center;
        box-sizing: border-box;
      }

      .end-buttons .start-button {
        background: #b81c12;
        border-color: #d32f22;
      }

      /* Messaggio di fine partita */
      #messaggio {
        margin-top: 20px;
        font-family: "Intro Rust";
        font-size: 1.1rem;
        color: #bf8c4e;
        min-height: 1.5rem;
        text-align: center;
        padding: 0 20px;
      }
    </style>
  </head>
  <body>
    <img
      id="logo-coce"
      src="assets/img/logo-coce-completo.svg"
      alt="logo Coce"
    />

    <div id="top-bar">
      <h1>Coppie: <span id="punteggio">0</span></h1>
      <h1>Tempo: <span id="time">10:00</span></h1>
    </div>

    <div id="campo"></div>

    <div id="tasti">
      <a id="back" href="../index.html">Torna Indietro</a>
      <button id="restart">Ricomincia</button>
    </div>

    <div id="start-modal">
      <div class="start-card">
        <img src="assets/img/i-ragazzi-confusi.png" alt="Bogdan contrariato" />
        <p>
          Che confusione!!! Trova tutte le coppie e aiutaci a riordinare il menù
        </p>
        <button id="start-button" class="start-button" type="button">
          Gioca
        </button>
      </div>
    </div>

    <div id="end-modal" class="hidden">
      <div class="start-card">
        <img id="end-image" src="assets/img/i-ragazzi-felici.png" alt="I ragazzi felici" />
        <p id="end-message">
          Mamma mia, che memoria! Il menù è di nuovo in ordine e i ragazzi
          possono tornare a lavoro. Grazie, mille!
        </p>
        <p class="end-stats">
          Tempo: <span id="end-time">00:00</span> &middot; Mosse:
          <span id="end-moves">0</span>
        </p>
        <div class="end-buttons">
          <a class="back-button" href="../index.html">Torna Indietro</a>
          <button id="end-restart" class="start-button" type="button">
            Ricomincia
          </button>
        </div>
      </div>
    </div>

    <div id="messaggio"></div>

    <script>
      /* ============================================================
         1. STRUTTURA DATI
         ============================================================ */
      const PIZZE = [
        { nome: "Carabinera", path: "assets/img/pizze/carabinera.jpg" },
        { nome: "Còce Veg", path: "assets/img/pizze/coce-veg.jpg" },
        {
          nome: "Curnut e Mazziat",
          path: "assets/img/pizze/curnut-e-mazziat.jpeg",
        },
        {
          nome: "Diavola Già Giù",
          path: "assets/img/pizze/diavola-gia-giu.jpg",
        },
        {
          nome: "Era Pizza Moscia",
          path: "assets/img/pizze/era-pizza-moscia.jpeg",
        },
        { nome: "Marinara", path: "assets/img/pizze/marinara.jpeg" },
        { nome: "Ricciarè", path: "assets/img/pizze/ricciare.jpeg" },
        {
          nome: "Scarola Mbuttunat",
          path: "assets/img/pizze/scarola-mbuttunat.jpg",
        },
        { nome: "Zì Nicola", path: "assets/img/pizze/zi-nicola.jpeg" },
        {
          nome: "Quattro Formaggi",
          path: "assets/img/pizze/quattro-formaggi.jpeg",
        },
        {
          nome: "Bianca Cotto e Mais",
          path: "assets/img/pizze/bianca-cotto-e-mais.jpeg",
        },
        {
          nome: "Bufala Confit",
          path: "assets/img/pizze/bufala-confit.jpeg",
        },
        { nome: "Capricciosa", path: "assets/img/pizze/capricciosa.jpeg" },
        {
          nome: "Margherita anni '80",
          path: "assets/img/pizze/margherita-anni-80.jpeg",
        },
      ];

      const NUM_COPPIE = 8; // 10 coppie = 20 carte → perfette per la griglia 4×5
      const TEMPO_INIZIALE = 360; // 10 minuti in secondi

      /* ============================================================
         2. STATO DEL GIOCO
         ============================================================ */
      let primaCarta = null;
      let bloccoClick = false;
      let coppieTrovate = 0;
      let mosse = 0;
      let secondi = TEMPO_INIZIALE;
      let timerId = null;
      let giocoAttivo = false;

      /* ============================================================
         3. RIFERIMENTI DOM
         ============================================================ */
      const campo = document.getElementById("campo");
      const punteggio = document.getElementById("punteggio");
      const elTime = document.getElementById("time");
      const elMessaggio = document.getElementById("messaggio");
      const btnRestart = document.getElementById("restart");
      const startModal = document.getElementById("start-modal");
      const btnStart = document.getElementById("start-button");
      const endModal = document.getElementById("end-modal");
      const elEndImage = document.getElementById("end-image");
      const elEndMessage = document.getElementById("end-message");
      const elEndTime = document.getElementById("end-time");
      const elEndMoves = document.getElementById("end-moves");
      const btnEndRestart = document.getElementById("end-restart");

      /* ============================================================
         4. UTILITÀ
         ============================================================ */
      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      function formattaTempo(sec) {
        if (sec < 0) sec = 0;
        const m = String(Math.floor(sec / 60)).padStart(2, "0");
        const s = String(sec % 60).padStart(2, "0");
        return `${m}:${s}`;
      }

      /* ============================================================
         5. CREAZIONE MAZZO
         ============================================================ */
      function creaMazzo() {
        // Estrae NUM_COPPIE pizze a caso dal pool completo
        const scelte = shuffle([...PIZZE]).slice(0, NUM_COPPIE);

        const mazzo = [];
        scelte.forEach((pizza, i) => {
          mazzo.push({ pizzaId: i, tipo: "image", contenuto: pizza.path });
          mazzo.push({ pizzaId: i, tipo: "name", contenuto: pizza.nome });
        });
        return shuffle(mazzo);
      }

      /* ============================================================
         6. RENDER
         ============================================================ */
      function render(mazzo) {
        campo.innerHTML = "";
        mazzo.forEach((carta) => {
          const card = document.createElement("div");
          card.className = "card";
          card.dataset.pizzaId = carta.pizzaId;
          card.dataset.tipo = carta.tipo;

          const inner = document.createElement("div");
          inner.className = "card-inner";

          // Faccia coperta (logo)
          const back = document.createElement("div");
          back.className = "card-back";
          const logo = document.createElement("img");
          logo.src = "assets/img/logo.jpg";
          logo.alt = "logo coce piccolo";
          back.appendChild(logo);

          // Faccia scoperta (pizza o nome)
          const front = document.createElement("div");
          front.className = "card-front";

          if (carta.tipo === "image") {
            const img = document.createElement("img");
            img.src = carta.contenuto;
            img.alt = "pizza";
            img.onerror = () => {
              img.remove();
              front.textContent = "🍕";
              front.style.fontSize = "2rem";
            };
            front.appendChild(img);
          } else {
            front.textContent = carta.contenuto;
          }

          inner.appendChild(back);
          inner.appendChild(front);
          card.appendChild(inner);

          card.addEventListener("click", () => giraCarta(card));
          campo.appendChild(card);
        });
      }

      /* ============================================================
         7. LOGICA DEL CLICK
         ============================================================ */
      function giraCarta(card) {
        if (!giocoAttivo) return;
        if (bloccoClick) return;
        if (
          card.classList.contains("girata") ||
          card.classList.contains("abbinata")
        )
          return;

        card.classList.add("girata");

        if (!primaCarta) {
          primaCarta = card;
          return;
        }

        // Seconda carta girata
        bloccoClick = true;
        mosse++;

        const stessaPizza = primaCarta.dataset.pizzaId === card.dataset.pizzaId;
        const tipoDiverso = primaCarta.dataset.tipo !== card.dataset.tipo;

        if (stessaPizza && tipoDiverso) {
          // ✅ Coppia trovata
          primaCarta.classList.add("abbinata");
          card.classList.add("abbinata");
          coppieTrovate++;
          punteggio.textContent = coppieTrovate;

          primaCarta = null;
          bloccoClick = false;

          if (coppieTrovate === NUM_COPPIE) {
            vittoria();
          }
        } else {
          // ❌ Errore: rigira dopo un attimo
          const c1 = primaCarta;
          const c2 = card;
          c1.classList.add("errore");
          c2.classList.add("errore");

          setTimeout(() => {
            c1.classList.remove("girata", "errore");
            c2.classList.remove("girata", "errore");
            primaCarta = null;
            bloccoClick = false;
          }, 800);
        }
      }

      /* ============================================================
         8. TIMER
         ============================================================ */
      function avviaTimer() {
        fermaTimer();
        secondi = TEMPO_INIZIALE;
        elTime.textContent = formattaTempo(secondi);

        timerId = setInterval(() => {
          secondi--;
          elTime.textContent = formattaTempo(secondi);
          if (secondi <= 0) {
            gameOver();
          }
        }, 1000);
      }

      function fermaTimer() {
        if (timerId) clearInterval(timerId);
        timerId = null;
      }

      /* ============================================================
         9. FINE PARTITA
         ============================================================ */
      function vittoria() {
        giocoAttivo = false;
        fermaTimer();
        mostraFinePartita(true);
      }

      function mostraFinePartita(vinta) {
        elEndImage.src = vinta
          ? "assets/img/i-ragazzi-felici.png"
          : "assets/img/i-ragazzi-tristi.png";
        elEndImage.alt = vinta ? "I ragazzi felici" : "I ragazzi tristi";
        elEndMessage.textContent = vinta
          ? "Mamma mia, che memoria! Il menù è di nuovo in ordine e i ragazzi possono tornare a lavoro. Grazie mille!"
          : "Oh no, tempo scaduto! Il menù è ancora in disordine e breve comincia il servizio!!!";
        elEndTime.textContent = formattaTempo(TEMPO_INIZIALE - secondi);
        elEndMoves.textContent = mosse;
        endModal.classList.remove("hidden");
      }

      function gameOver() {
        giocoAttivo = false;
        fermaTimer();
        elTime.textContent = "00:00";
        mostraFinePartita(false);
      }

      /* ============================================================
         10. AVVIO / RESET
         ============================================================ */

      function preparaPartita() {
        fermaTimer();

        primaCarta = null;
        bloccoClick = false;
        coppieTrovate = 0;
        mosse = 0;
        giocoAttivo = false; // 👈 carte non cliccabili finché non si gioca

        punteggio.textContent = 0;
        elMessaggio.textContent = "";
        endModal.classList.add("hidden");
        elTime.textContent = formattaTempo(TEMPO_INIZIALE);

        render(creaMazzo()); // tabellone già pronto dietro al modale
      }

      function avviaPartita() {
        giocoAttivo = true;
        avviaTimer(); // parte il timer
      }

      function avviaGioco() {
        // usata da "Ricomincia"
        preparaPartita();
        avviaPartita();
      }

      /* ============================================================
         11. EVENT LISTENERS
         ============================================================ */
      btnRestart.addEventListener("click", avviaGioco);
      btnEndRestart.addEventListener("click", avviaGioco);

      btnStart.addEventListener("click", () => {
        startModal.classList.add("hidden");
        avviaPartita(); // 👈 ora parte il timer
      });

      // Avvio iniziale: mostra il tabellone ma NON far partire il timer
      preparaPartita();
    </script>
  </body>
</html>
